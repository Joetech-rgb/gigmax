{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Bulk Order <span class="badge bg-danger">Extreme Heat</span></h2>
    
    <div class="card shadow-sm">
        <div class="card-body">
            <label for="bulk_input" class="form-label">Paste Numbers & GB (Format: 0244111222 5GB)</label>
            <textarea id="bulk_input" class="form-control" rows="10" 
                      placeholder="0244111222 5GB&#10;0555999888 10GB"></textarea>
            
            <div class="mt-3 p-3 bg-light border rounded">
                <div class="row text-center">
                    <div class="col"><strong>Valid Orders:</strong> <span id="total_orders">0</span></div>
                    <div class="col"><strong>Total GB:</strong> <span id="total_gb">0</span></div>
                    <div class="col text-danger"><strong>Total Amount:</strong> GHS <span id="total_amount">0.00</span></div>
                </div>
            </div>

            <div id="place_order_section" class="mt-4 text-end" style="display: none;">
                <hr>
                <div class="btn-group">
                    {% if user.wallet_balance > 0 %}
                    <button class="btn btn-success btn-lg">Pay with Wallet (GHS {{ user.wallet_balance }})</button>
                    {% endif %}
                    
                    {% if user.debt_page_access %}
                    <button class="btn btn-warning btn-lg">Place on Debt</button>
                    {% endif %}
                    
                    <button class="btn btn-primary btn-lg">Pay with Paystack</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('bulk_input').addEventListener('input', function(e) {
    let rawText = e.target.value;
    let lines = rawText.split(/\r?\n/);
    
    let validCount = 0;
    let totalGB = 0;
    let pricePerGB = 5.00; // You can make this dynamic from the backend later

    lines.forEach(line => {
        // Cleaning line and splitting by spaces/commas
        let parts = line.trim().split(/[ ,]+/); 
        let phone = parts[0] || "";
        let gbText = parts[1] || "";
        let gbValue = parseFloat(gbText.replace(/[^\d.]/g, ''));

        // VOIDING RULES: 10 digits, starts with 0, No alphabets
        let isPhoneValid = /^0\d{9}$/.test(phone);
        let isGbValid = !isNaN(gbValue) && gbValue > 0;

        if (isPhoneValid && isGbValid) {
            validCount++;
            totalGB += gbValue;
        }
    });

    // Update UI
    document.getElementById('total_orders').innerText = validCount;
    document.getElementById('total_gb').innerText = totalGB + " GB";
    document.getElementById('total_amount').innerText = (totalGB * pricePerGB).toFixed(2);

    // Auto-pop the payment section if we have valid orders
    document.getElementById('place_order_section').style.display = validCount > 0 ? 'block' : 'none';
});
</script>

<style>
    textarea#bulk_input {
        font-family: 'Courier New', Courier, monospace;
        border: 2px solid #ddd;
    }
    textarea#bulk_input:focus {
        border-color: #ff4500;
        box-shadow: 0 0 10px rgba(255, 69, 0, 0.2);
    }
    .tier-extreme-heat { color: #ff4500; font-weight: bold; text-transform: uppercase; }
</style>
{% endblock %}
