{# Track-your-order form for standalone pages such as link_order.html #}
<div style="max-width:520px; margin:16px auto 0; padding:0 16px;">
    <form method="get" action="{% url 'track_order' %}"
          style="background:var(--card,#fff); border:1px solid var(--border,#dce8f8); border-radius:12px; padding:14px 16px;">
        <p style="font-weight:700; margin:0 0 8px; color:var(--text,#0d1a2e);">Track your order</p>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" name="query" required autocomplete="off" placeholder="Phone number or Order ID"
                   style="flex:1; min-width:180px; padding:10px 12px; border:1px solid var(--border,#dce8f8); border-radius:8px; font-size:0.95rem;">
            <button type="submit"
                    style="padding:10px 18px; border:0; border-radius:8px; background:var(--primary,#033968); color:#fff; font-weight:700; cursor:pointer;">Track</button>
        </div>
        <p style="margin:8px 0 0; font-size:0.8rem; color:var(--muted,#6b7f9e);">
            Enter the number you bought data for, or your Order ID, to see the current status.
        </p>
    </form>
</div>
